<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rebote 3D</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <p id="mensagem" class="mensagem" hidden></p>
      <p id="aviso" class="aviso" hidden></p>

      <aside id="visao" class="painel-visao">
        <figure>
          <canvas id="canvas-camera" class="calibravel" width="320" height="240"></canvas>
          <figcaption>Câmera com o contorno e o centróide. <strong>Clique no objeto</strong> para calibrar a cor.</figcaption>
        </figure>
        <figure>
          <canvas id="canvas-mascara" width="320" height="240"></canvas>
          <figcaption>Máscara HSV depois da abertura e do fechamento</figcaption>
        </figure>
        <figure class="entrada-gesto">
          <canvas id="canvas-gesto" width="144" height="204"></canvas>
          <figcaption>Entrada do classificador de gestos: zona da mão livre, com o objeto apagado</figcaption>
        </figure>
        <p id="status-captura" class="status">Aguardando a câmera…</p>
        <p id="status-visao" class="status"></p>
        <p id="status-ia" class="status"></p>
      </aside>
    </div>

    <!-- fonte de imagem: não aparece na tela, é lida pelo canvas de processamento -->
    <video id="video" class="fora-da-tela" playsinline muted></video>
    <input id="arquivo-video" type="file" accept="video/*" hidden />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
